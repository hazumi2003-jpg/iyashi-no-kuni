
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青 海深 | 住人名鑑</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7f7ef;
    color: #555555;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
}

header {
    padding: 25px 20px;
    text-align: center;
}

.site-logo {
    width: min(80%, 500px);
    height: auto;
}

main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
}

.page-title {
    text-align: center;
    margin: 25px 0 35px;
}

.page-title h1 {
    color: #269E9C;
    font-size: 30px;
    margin-bottom: 8px;
}

.page-title p {
    letter-spacing: 3px;
    color: #82C9C5;
    font-size: 12px;
}

.profile {
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 30px;
    align-items: start;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 20px #55555512;
}

.character-sheet {
    width: 100%;
    border-radius: 12px;
    display: block;
}

.name {
    color: #269E9C;
    font-size: 27px;
    margin: 0 0 8px;
}

.catchcopy {
    color: #82BDB9;
    margin-bottom: 22px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

td {
    padding: 11px 8px;
    border-bottom: 1px solid #E5F1EF;
}

td:first-child {
    width: 34%;
    color: #6BAEAA;
    font-weight: bold;
}

.section {
    background: white;
    padding: 25px;
    margin-top: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 20px #55555512;
}

.section h2 {
    color: #269E9C;
    font-size: 20px;
    border-bottom: 2px solid #D9EFED;
    padding-bottom: 10px;
}

.section p {
    line-height: 1.9;
}

.voice {
    background: #EFF9F8;
    padding: 18px;
    border-radius: 12px;
    line-height: 1.9;
    color: #438F8B;
}

.back {
    display: block;
    width: fit-content;
    margin: 35px auto;
    padding: 12px 28px;
    border-radius: 30px;
    background: #35AAA6;
    color: white;
    text-decoration: none;
    transition: 0.2s;
}

.back:hover {
    background: #258D89;
    transform: translateY(-3px);
}

footer {
    text-align: center;
    padding: 25px;
    color: #9aab9c;
    font-size: 12px;
}

@media (max-width: 650px) {
    .profile {
        grid-template-columns: 1fr;
    }

    .character-sheet {
        max-width: 420px;
        margin: 0 auto;
    }
}

/* TOPへ戻るボタン */
#back-to-top {
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: #35AAA6;
    color: #FFFFFF;
    font-size: 25px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
    z-index: 1000;
    transition: opacity 0.3s, transform 0.3s;
}

#back-to-top:hover {
    transform: translateY(-4px);
}

html {
    scroll-behavior: smooth;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.gallery img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.25s;
}

.gallery img:hover {
    transform: translateY(-4px);
    box-shadow: 0 5px 15px #88888833;
}

@media (max-width: 650px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

/* ギャラリー拡大表示 */
.lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(30, 30, 30, 0.85);
    z-index: 2000;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.lightbox.active {
    display: flex;
}

.lightbox img {
    max-width: 90%;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 12px;
}

.lightbox-close {
    position: absolute;
    top: 20px;
    right: 25px;
    color: white;
    font-size: 35px;
    cursor: pointer;
    background: none;
    border: none;
}


.character-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-top: 40px;
}

.character-nav a {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 30px;
    text-decoration: none;
    text-align: center;
    transition: 0.2s;
}

.character-nav .prev,
.character-nav .back,
.character-nav .next {
    background: #35AAA6;
    color: white;
}

.character-nav .back {
    margin: 0;
}

.character-nav a:hover {
    background: #258D89;
    transform: translateY(-3px);
}

@media (max-width: 650px) {
    .character-nav {
        flex-direction: column;
        gap: 12px;
    }

    .character-nav a {
        width: 100%;
        padding: 13px 10px;
        font-size: 14px;
    }
}


</style>
</head>

<body>

<button id="back-to-top" aria-label="ページの一番上へ戻る">
    ↑
</button>

<header>
    <img src="images/logo.png" alt="癒しの国での日常" class="site-logo">
</header>

<main>

<div class="page-title">
    <h1>青 海深</h1>
    <p>HAISHEN</p>
</div>

<section class="profile">

    <div>
        <img
            src="images/characters/xiwan/sheets/ハイシェン.jpg"
            alt="青 海深のキャラクターシート"
            class="character-sheet">
    </div>

    <div>
        <h2 class="name">青 海深</h2>
        <p class="catchcopy">海の波のように元気な少女</p>

        <table>
            <tr><td>読み方</td><td>チンハイシェン</td></tr>
            <tr><td>モチーフ</td><td>自然・海</td></tr>
            <tr><td>種族</td><td>人間</td></tr>
            <tr><td>年齢</td><td>17歳</td></tr>
            <tr><td>身長</td><td>170cm</td></tr>
            <tr><td>出身地</td><td>希望街</td></tr>
            <tr><td>誕生日</td><td>7月20日</td></tr>
            <tr><td>所属</td><td>魔法学園</td></tr>
            <tr><td>専攻</td><td>黒魔法</td></tr>
        </table>
    </div>

</section>

<section class="section">
    <h2>人物紹介</h2>
    <p>
        希望街の魔法学園に通う生徒で、黒魔法を専攻している。
        <br><br>
        とにかく騒がしい元気な少女。
        黙っていれば美人。
    </p>
</section>

<section class="section">
    <h2>サンプルボイス</h2>
    <div class="voice">
        「わー！これ超楽しいぞ！」
    </div>
</section>

<section class="section">
    <h2>GALLERY</h2>
    <div class="gallery">
        <img
            src="images/characters/xiwan/gallery/haishen/haishen_01.jpg"
            alt="青 海深のイラスト">
    </div>
</section>


<div class="character-nav">
    <a href="rui.html" class="next">← 前のキャラクター：ルイ</a>
    <a href="residents.html" class="back">住人名鑑へ戻る</a>
    <a href="xiaoming.html" class="next">次のキャラクター：朱 暁明 →</a>
</div>


</main>

<div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close" aria-label="閉じる">
        ×
    </button>
    <img src="" alt="拡大表示" id="lightbox-image">
</div>

<footer>
    © 癒しの国での日常
</footer>

<script>
document.getElementById("back-to-top").addEventListener("click", function() {
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});

const galleryImages = document.querySelectorAll(".gallery img");
const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightbox-image");
const lightboxClose = document.getElementById("lightbox-close");

galleryImages.forEach(image => {
    image.addEventListener("click", () => {
        lightboxImage.src = image.src;
        lightboxImage.alt = image.alt;
        lightbox.classList.add("active");
    });
});

lightbox.addEventListener("click", event => {
    if (event.target === lightbox) {
        lightbox.classList.remove("active");
    }
});

lightboxClose.addEventListener("click", () => {
    lightbox.classList.remove("active");
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        lightbox.classList.remove("active");
    }
});

</script>

</body>
</html>

/* TOPへ戻るボタン */
#back-to-top {
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: #57946D;
    color: #FFFFFF;
    font-size: 25px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
    z-index: 1000;
    transition: opacity 0.3s, transform 0.3s;
}

#back-to-top:hover {
    transform: translateY(-4px);
}

html {
    scroll-behavior: smooth;
}



/* ファンアート展示 */
.fanart-preview {
    max-width: 1000px;
    margin: 50px auto 65px;
    padding: 30px 0;
    background: #fffef8;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 5px 18px rgba(60, 90, 65, 0.06);
}

.fanart-heading {
    text-align: center;
    margin-bottom: 25px;
}

.fanart-heading a {
    color: #47775c;
    text-decoration: none;
    font-size: 22px;
    letter-spacing: 3px;
    font-weight: bold;
}

.fanart-heading p {
    color: #83A58B;
    font-size: 11px;
    letter-spacing: 3px;
}

.fanart-track {
    display: flex;
    width: max-content;
    gap: 18px;
    animation: fanart-scroll 32s linear infinite;
}

.fanart-preview:hover .fanart-track {
    animation-play-state: paused;
}

.fanart-track a {
    display: block;
    width: 190px;
    flex-shrink: 0;
}

.fanart-track img {
    display: block;
    width: 100%;
    height: 190px;
    object-fit: contain;
    background: #F1F2EC;
    border-radius: 10px;
}

@keyframes fanart-scroll {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(-50%);
    }
}

@media (max-width: 600px) {
    .fanart-track a {
        width: 150px;
    }

    .fanart-track img {
        height: 150px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .fanart-track {
        animation: none;
    }
}

@media (max-width: 600px) {

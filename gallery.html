
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギャラリー | 癒しの国での日常</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #F7F7EF;
    color: #405447;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
}

header {
    padding: 25px 20px;
    text-align: center;
    background: #47775C;
}

.site-logo {
    width: min(80%, 500px);
    height: auto;
    display: block;
    margin: 0 auto;
}

main {
    max-width: 900px;
    margin: 0 auto;
    padding: 55px 20px 70px;
}

h1 {
    text-align: center;
    color: #47775C;
    font-size: 30px;
    letter-spacing: 3px;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #83A58B;
    letter-spacing: 3px;
    font-size: 13px;
    margin-bottom: 45px;
}

.manga-section {
    background: #fff;
    border-radius: 18px;
    padding: 30px 20px;
    box-shadow: 0 5px 18px rgba(60, 90, 65, 0.08);
}

.manga-title {
    text-align: center;
    color: #47775C;
    font-size: 21px;
    margin-bottom: 8px;
}

.manga-caption {
    text-align: center;
    color: #999;
    font-size: 13px;
    margin-bottom: 30px;
}

.manga-pages {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
}

.manga-pages img {
    display: block;
    width: 100%;
    max-width: 650px;
    height: auto;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    transition: transform 0.2s;
}

.manga-pages img:hover {
    transform: scale(1.01);
}

.back-link {
    display: block;
    width: fit-content;
    margin: 40px auto 0;
    padding: 12px 30px;
    border-radius: 30px;
    background: #47775C;
    color: white;
    text-decoration: none;
    transition: 0.2s;
}

.back-link:hover {
    background: #57946D;
    transform: translateY(-3px);
}

.lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(20, 30, 23, 0.9);
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.lightbox img {
    max-width: 95%;
    max-height: 90vh;
    object-fit: contain;
}

.lightbox.active {
    display: flex;
}

@media (max-width: 600px) {
    main {
        padding: 35px 12px 50px;
    }

    h1 {
        font-size: 25px;
    }

    .manga-section {
        padding: 22px 12px;
    }
}


/* TOPへ戻るボタン */
#back-to-top {
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: #57946D;
    color: #FFFFFF;
    font-size: 25px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
    z-index: 1000;
    transition: opacity 0.3s, transform 0.3s;
}

#back-to-top:hover {
    transform: translateY(-4px);
}

html {
    scroll-behavior: smooth;
}


</style>
</head>


<button id="back-to-top" aria-label="ページの一番上へ戻る">
    ↑
</button>

<script>
document.getElementById("back-to-top").addEventListener("click", function() {
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});
</script>


<body>

<header>
    <img src="images/logo.png" alt="癒しの国での日常" class="site-logo">
</header>

<main>
    <h1>ギャラリー</h1>
    <p class="subtitle">GALLERY</p>

    <section class="manga-section">
        <h2 class="manga-title">漫画</h2>
        <p class="manga-caption">ILLUSTRATION & COMIC</p>

        <div class="manga-pages">
            <img src="images/manga/manga_01.jpg" alt="漫画 1ページ目">
            <img src="images/manga/manga_02.jpg" alt="漫画 2ページ目">
            <img src="images/manga/manga_03.jpg" alt="漫画 3ページ目">
            <img src="images/manga/manga_04.jpg" alt="漫画 4ページ目">
        </div>
    </section>

    <a href="index.html" class="back-link">トップページへ戻る</a>
</main>

<div class="lightbox" id="lightbox">
    <img src="" alt="拡大画像" id="lightbox-image">
</div>

<script>
const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightbox-image");

document.querySelectorAll(".manga-pages img").forEach(img => {
    img.addEventListener("click", () => {
        lightboxImage.src = img.src;
        lightbox.classList.add("active");
    });
});

lightbox.addEventListener("click", () => {
    lightbox.classList.remove("active");
});
</script>

</body>
</html>
